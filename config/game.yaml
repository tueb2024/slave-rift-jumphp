game:
  id: slave-rift
  title: "SLAVE RIFT"
  version: 0.4.0-rc.1
  description: "Survie FPS : vagues, arsenal rythmique, boss et trésor."
  descriptions:
    fr: "Survie FPS rétro : vagues, autotir, expérience et améliorations."
    en: "Retro FPS survival: hordes, auto fire, experience and upgrades."
  width: 320
  height: 180
  scale: 3
  background: [8, 7, 10]
  start_scene: App\Scene\PlayScene
  lang: fr
  controls: "Z/S ou flèches : avancer, Q/D : déplacement latéral, gauche/droite : tourner, espace : saut. Tir automatique. P : pause, entrée : jouer/rejouer. Tactile : joystick et boutons."
  pwa: { short_name: SLAVE RIFT, theme_color: '#08070a' }
  smoke:
    scene: App\Scene\PlayScene
    params: { demo: true }

  touch:
    pad: stick
    a: Space
    b: P
    start: Return
    select: P
    labels: {a: SAUT, b: PAUSE, start: OK, select: PAUSE, rotate: TOURNEZ LE TELEPHONE}
