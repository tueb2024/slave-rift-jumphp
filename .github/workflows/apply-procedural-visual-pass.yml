name: Apply procedural visual pass

on:
  push:
    branches: [agent/procedural-game-foundation]
    paths:
      - 'patches/procedural-final.ready'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/procedural-game-foundation
      - name: Apply verified final source patches
        run: |
          set -euxo pipefail
          for patch_file in \
            patches/final-run.patch \
            patches/final-meshes.patch \
            patches/final-world.patch \
            patches/final-playscene.patch
          do
            test -s "$patch_file"
            patch -p1 < "$patch_file"
          done
          php tools/sync-package.php
          php tools/sync-package.php --check
          php tools/simulation-test.php
          find src tests games/slave-rift/src games/slave-rift/tests -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -20 /tmp/php-lint.log
      - name: Commit playable procedural visual pass
        run: |
          set -euxo pipefail
          rm -f patches/procedural-final.ready
          rm -f patches/final-run.patch patches/final-meshes.patch patches/final-world.patch patches/final-playscene.patch
          rm -f patches/procedural-visual-pass.tar.gz patches/procedural-visual-pass.part00 patches/procedural-visual-pass.part01
          rm -f .github/workflows/apply-procedural-visual-pass.yml
          rm -f .github/workflows/workspace-snapshot.yml
          rm -f .github/workflows/vendor-boss-and-poster-assets.yml
          git config user.name 'slave-rift-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: procedural textured rooms, troll posters and weighted enemies'
          git push origin HEAD:agent/procedural-game-foundation
