name: Apply primary weapons pass B

on:
  push:
    branches: [agent/primary-weapons-pass-b]
    paths:
      - tools/apply-primary-weapons-pass-b.py
      - .github/workflows/apply-primary-weapons-pass-b.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/primary-weapons-pass-b
      - name: Patch rhythmic primary progression
        run: python3 tools/apply-primary-weapons-pass-b.py
      - name: Commit patched gameplay
        shell: bash
        run: |
          git diff --check
          git add src/Game/Run.php games/slave-rift/src/Game/Run.php src/Scene/PlayScene.php games/slave-rift/src/Scene/PlayScene.php
          if git diff --cached --quiet; then
            echo "No primary weapon changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "gameplay: lock primary weapons to rhythm progression"
          git push origin HEAD:agent/primary-weapons-pass-b
