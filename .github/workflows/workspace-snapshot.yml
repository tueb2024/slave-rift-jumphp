name: Workspace snapshot

on:
  push:
    branches: [agent/procedural-game-foundation]
    paths:
      - '.github/workflows/workspace-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/procedural-game-foundation
      - name: Pack editable workspace
        run: |
          tar -czf /tmp/slave-rift-workspace.tar.gz \
            src tests config assets tools composer.json patches \
            games/slave-rift \
            .github/workflows/checks.yml
      - uses: actions/upload-artifact@v4
        with:
          name: slave-rift-workspace
          path: /tmp/slave-rift-workspace.tar.gz
          retention-days: 1
