name: Fix wheel injection

on:
  push:
    branches: [asset-wave-pass]
    paths:
      - '.github/workflows/fix-wheel-injection.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asset-wave-pass
      - run: python3 tools/fix_wheel_injection.py
      - run: php tools/sync-package.php
      - name: Commit fix
        run: |
          git config user.name 'slave-rift-asset-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src config composer.json games/slave-rift tools
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use game-local wheel input service'
          git push origin HEAD:asset-wave-pass
