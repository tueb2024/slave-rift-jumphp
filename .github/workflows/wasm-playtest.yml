name: WASM playtest

on:
  push:
    branches: [main, release/playable-rc]
  workflow_dispatch:

concurrency:
  group: wasm-playtest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Slave Rift
        uses: actions/checkout@v4
        with:
          path: game

      - name: Checkout pinned JumPHP runtime
        uses: actions/checkout@v4
        with:
          repository: davidnurdin/jumPhp
          ref: 28ea932981fb0b6d8dc41f2c9739f941cb4befea
          path: runtime

      - name: Stage game in pinned JumPHP
        run: |
          set -euxo pipefail
          cp -a game/games/slave-rift runtime/games/slave-rift
          python3 - <<'PY'
          import json
          p = 'runtime/games/slave-rift/composer.json'
          with open(p, encoding='utf-8') as f:
              c = json.load(f)
          c.setdefault('config', {})['github-protocols'] = ['https']
          c['repositories'] = [
              {'type': 'path', 'url': '../../engine'},
              {'type': 'vcs', 'url': 'https://github.com/davidnurdin/php-wasm-network'}
          ]
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(c, f, indent=2)
          PY

      - name: Build JumPHP desktop toolchain
        working-directory: runtime
        run: docker build -t jumphp/desktop:dev --build-context ext=docker/ext docker/desktop

      - name: Download pinned WASM engine
        working-directory: runtime
        run: bin/jumphp engine:download

      - name: Build Slave Rift for WebAssembly
        working-directory: runtime
        run: bin/jumphp build slave-rift

      - name: Verify web payload
        run: |
          set -euxo pipefail
          test -s runtime/games/slave-rift/dist/web/index.html
          test -s runtime/games/slave-rift/dist/web/php-web.wasm
          test -s runtime/games/slave-rift/dist/web/php-web.data
          test -s runtime/games/slave-rift/dist/web/php-web.mjs
          du -h runtime/games/slave-rift/dist/web/* | sort -h

      - name: Test desktop and mobile browser UI
        run: |
          mkdir -p browser-screenshots
          chmod 777 browser-screenshots
          docker run -d --name rc-web -p 127.0.0.1:18999:80 \
            -v "$PWD/runtime/games/slave-rift/dist/web:/srv:ro" \
            -v "$PWD/runtime/docker/web/Caddyfile:/etc/frankenphp/Caddyfile:ro" \
            dunglas/frankenphp:1.12.7-alpine
          trap 'docker rm -f rc-web' EXIT
          docker run --rm --network host --init \
            -v "$PWD/game/tools/rc-browser-test.cjs:/scripts/rc-browser-test.cjs:ro" \
            -v "$PWD/browser-screenshots:/out" -w /home/pptruser \
            ghcr.io/puppeteer/puppeteer:24.10.0 \
            sh -c 'cp /scripts/rc-browser-test.cjs . && node rc-browser-test.cjs'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-browser-screenshots
          path: browser-screenshots/
          if-no-files-found: ignore

      - name: Upload WASM playtest
        uses: actions/upload-artifact@v4
        with:
          name: slave-rift-wasm-${{ github.sha }}
          path: runtime/games/slave-rift/dist/web/
          if-no-files-found: error
          retention-days: 14

      - name: Publish WASM playtest branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          publish="$RUNNER_TEMP/slave-rift-pages"
          mkdir -p "$publish"
          cd "$publish"
          git init -b gh-pages
          git config user.name "slave-rift-wasm-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch --depth=1 origin gh-pages
            git checkout -B gh-pages FETCH_HEAD
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/runtime/games/slave-rift/dist/web/." .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "wasm playtest ${GITHUB_SHA}"
          fi
          git push origin HEAD:gh-pages
