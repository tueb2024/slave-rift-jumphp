name: Apply weapon contract migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weapon-contract-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply corrected weapon contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          run = Path('src/Game/Run.php')
          s = run.read_text()

          # Shuriken is gone: the same upgrade slot becomes homing mini-rockets.
          s = s.replace('$shurikenRank', '$rocketRank')
          s = s.replace('$shurikenClock', '$rocketClock')
          s = s.replace('fireShuriken', 'fireMiniRockets')
          s = s.replace('upgradeShuriken', 'upgradeMiniRockets')
          s = s.replace("'SHURIKEN'", "'MINI_ROCKETS'")
          s = s.replace("'SHURIKEN L'", "'ROCKET L'")
          s = s.replace("'shuriken'", "'rocket'")

          # Normal primaries remain auto-aimed across the useful visible field.
          old = "$cone = $stage >= 5 ? 0.24 : 0.18;"
          if old not in s:
              raise SystemExit('primary cone marker missing')
          s = s.replace(old, "$cone = 1.05; // normal weapons deliberately keep strong auto-aim")

          # Mini-rocket salvo: auto-target visible enemies, one projectile per target.
          s = s.replace(
              "$count = 4 + ($this->rocketRank - 1) * 2;\n        $targets = $this->findTargets(18.0, 1.35, $count);",
              "$count = 2 + ($this->rocketRank - 1) * 2;\n        $targets = $this->findTargets(22.0, 1.15, $count);"
          )
          s = s.replace(
              "$damage = (int)round((26 + ($this->rocketRank - 1) * 8) * (1 + $this->damageRank * 0.25));",
              "$damage = (int)round((34 + ($this->rocketRank - 1) * 12) * (1 + $this->damageRank * 0.25));"
          )
          s = s.replace(
              "$this->rocketClock = max(1.4, 3.1 - ($this->rocketRank - 1) * 0.4 - $this->hasteRank * 0.12);",
              "$this->rocketClock = max(2.0, 4.5 - ($this->rocketRank - 1) * 0.55 - $this->hasteRank * 0.12);"
          )
          s = s.replace(
              "'MINI_ROCKETS' => $this->rocketRank === 0 ? 'VOLLEY HITS UP TO 4 TARGETS' : 'MORE TARGETS / FASTER VOLLEY',",
              "'MINI_ROCKETS' => $this->rocketRank === 0 ? 'AUTO-TARGET MINI-ROCKET SALVO' : 'MORE ROCKETS / MORE DAMAGE',"
          )
          s = s.replace(
              "$this->rocketRank = min(3, $this->rocketRank + 1);",
              "$this->rocketRank = min(4, $this->rocketRank + 1);"
          )

          run.write_text(s)
          shutil.copy2(run, 'games/slave-rift/src/Game/Run.php')

          # Renderer trace terminology follows gameplay: there is no shuriken path anymore.
          for name in ['src/Gfx/World.php', 'games/slave-rift/src/Gfx/World.php']:
              p = Path(name)
              w = p.read_text().replace("'shuriken' => [125, 225, 255]", "'rocket' => [255, 150, 65]")
              p.write_text(w)

          # Remove the anonymous blue PULSE rectangle from the HUD.
          for name in ['src/Scene/PlayScene.php', 'games/slave-rift/src/Scene/PlayScene.php']:
              p = Path(name)
              q = p.read_text()
              block = """        if ($run->pulseUnlocked) {\n            $r->fillRect($w - 41, $h - 30, 24, 23, [43,63,80]);\n            $r->fillRect($w - 33, $h - 37, 8, 20, $run->pulse > 0 ? [180,255,255] : [70,180,195]);\n        }\n"""
              q = q.replace(block, '')
              p.write_text(q)

          # This workflow is a one-shot migration, not project infrastructure.
          Path('.github/workflows/weapon-contract-migration.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore auto-aim and replace shuriken with mini-rockets"
          git push origin HEAD:main
