name: Apply rhythm pass A

on:
  push:
    branches: [agent/rhythm-pass-a]
    paths:
      - tools/apply-rhythm-pass-a.py
      - .github/workflows/apply-rhythm-pass-a.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rhythm-pass-a
      - name: Patch PlayScene rhythm integration
        run: python3 tools/apply-rhythm-pass-a.py
      - name: Commit patched scenes
        shell: bash
        run: |
          git diff --check
          git add src/Scene/PlayScene.php games/slave-rift/src/Scene/PlayScene.php
          if git diff --cached --quiet; then
            echo "No PlayScene changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audio: drive soundtrack from fixed rhythm transport"
          git push origin HEAD:agent/rhythm-pass-a
