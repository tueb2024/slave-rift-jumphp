name: Import credible CC0 weapons

on:
  push:
    branches: [fix/credible-fps-weapons]
    paths:
      - .github/workflows/import-credible-weapons.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          python -m pip install --disable-pip-version-check pillow
      - name: Fetch CC0 sources
        run: |
          mkdir -p tools/weapon-sources
          curl -fL 'https://opengameart.org/sites/default/files/brn10_sheet2_0.png' -o tools/weapon-sources/brn10.png
          curl -fL 'https://opengameart.org/sites/default/files/Mini%20gun.blend' -o tools/weapon-sources/minigun.blend
      - name: Render and build atlases
        run: |
          blender -b tools/weapon-sources/minigun.blend --python tools/render_gatling.py -- "$GITHUB_WORKSPACE/tools/weapon-sources"
          python tools/build_weapon_atlases.py
          cp assets/sprites/weapons/fps-colt.png games/slave-rift/assets/sprites/weapons/fps-colt.png
          cp assets/sprites/weapons/fps-mp44.png games/slave-rift/assets/sprites/weapons/fps-mp44.png
          cp assets/sprites/weapons/fps-bar.png games/slave-rift/assets/sprites/weapons/fps-bar.png
          cp assets/sprites/weapons/fps-gatling.png games/slave-rift/assets/sprites/weapons/fps-gatling.png
          sha256sum assets/sprites/weapons/fps-*.png
      - name: Commit generated atlases
        run: |
          git add assets/sprites/weapons/fps-colt.png assets/sprites/weapons/fps-mp44.png assets/sprites/weapons/fps-bar.png assets/sprites/weapons/fps-gatling.png
          git add games/slave-rift/assets/sprites/weapons/fps-colt.png games/slave-rift/assets/sprites/weapons/fps-mp44.png games/slave-rift/assets/sprites/weapons/fps-bar.png games/slave-rift/assets/sprites/weapons/fps-gatling.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: rebuild credible CC0 FPS weapon atlases'
          git push origin HEAD:fix/credible-fps-weapons
