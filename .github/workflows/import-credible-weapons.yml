name: Import credible CC0 weapons

on:
  push:
    branches: [fix/credible-fps-weapons]
    paths:
      - .github/workflows/import-credible-weapons.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          python -m pip install --disable-pip-version-check pillow
      - name: Fetch CC0 sources
        run: |
          mkdir -p tools/weapon-sources
          curl -fL 'https://opengameart.org/sites/default/files/brn10_sheet2_0.png' -o tools/weapon-sources/brn10.png
          curl -fL 'https://opengameart.org/sites/default/files/Mini%20gun.blend' -o tools/weapon-sources/minigun.blend
      - name: Render and build atlases
        run: |
          blender -b tools/weapon-sources/minigun.blend --python tools/render_gatling.py -- "$GITHUB_WORKSPACE/tools/weapon-sources"
          python tools/build_weapon_atlases.py
          cp assets/sprites/weapons/fps-colt.png games/slave-rift/assets/sprites/weapons/fps-colt.png
          cp assets/sprites/weapons/fps-mp44.png games/slave-rift/assets/sprites/weapons/fps-mp44.png
          cp assets/sprites/weapons/fps-bar.png games/slave-rift/assets/sprites/weapons/fps-bar.png
          cp assets/sprites/weapons/fps-gatling.png games/slave-rift/assets/sprites/weapons/fps-gatling.png
      - name: Apply verified display names and vendored hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          block = """public function primaryWeaponLabel(): string
              {
                  return match ($this->primaryStage) {
                      0 => 'PISTOL',
                      1 => 'DUAL PISTOL',
                      2 => 'MACHINE GUN',
                      3 => 'DUAL MACHINE GUN',
                      4 => 'BRN-10',
                      5 => 'GATLING',
                      default => 'DUAL GATLING',
                  };
              }"""
          for rel in ('src/Game/Run.php', 'games/slave-rift/src/Game/Run.php'):
              p = Path(rel)
              text = p.read_text()
              text, n = re.subn(r"public function primaryWeaponLabel\(\): string\s*\{.*?\n\s*\}", block, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'primaryWeaponLabel block not found in {rel}')
              p.write_text(text)

          names = ('fps-colt.png','fps-mp44.png','fps-bar.png','fps-gatling.png')
          vendored = Path('assets/VENDORED.sha256')
          lines = vendored.read_text().splitlines()
          suffixes = {f'assets/sprites/weapons/{name}' for name in names}
          lines = [line for line in lines if not any(line.endswith('  ' + suffix) for suffix in suffixes)]
          for name in names:
              path = Path('assets/sprites/weapons') / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  assets/sprites/weapons/{name}')
          text = '\n'.join(lines) + '\n'
          vendored.write_text(text)
          Path('games/slave-rift/assets/VENDORED.sha256').write_text(text)
          PY
      - name: Commit imported weapon pass
        run: |
          git add assets/sprites/weapons/fps-colt.png assets/sprites/weapons/fps-mp44.png assets/sprites/weapons/fps-bar.png assets/sprites/weapons/fps-gatling.png
          git add games/slave-rift/assets/sprites/weapons/fps-colt.png games/slave-rift/assets/sprites/weapons/fps-mp44.png games/slave-rift/assets/sprites/weapons/fps-bar.png games/slave-rift/assets/sprites/weapons/fps-gatling.png
          git add src/Game/Run.php games/slave-rift/src/Game/Run.php assets/VENDORED.sha256 games/slave-rift/assets/VENDORED.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete credible FPS weapon import' || true
          git push origin HEAD:fix/credible-fps-weapons
